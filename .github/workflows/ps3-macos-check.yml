name: parallel-ps3 macOS arm64 build check

on:
  push:
    branches: [ps3-macos-check]
  workflow_dispatch:

env:
  PS3_COMMIT: 9d333be99482f1cbb0bbe084ca9827850bf99403

jobs:
  macos-arm64:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-xlarge, macos-26]
    timeout-minutes: 340
    steps:
      - name: Toolchain
        run: |
          ls /Applications | grep Xcode; xcode-select -p
          clang --version
          sw_vers
          uname -m
      - name: Fetch parallel-ps3 at the commit to pin
        run: |
          git init -q ps3
          git -C ps3 fetch -q --depth 1 https://github.com/libretro-fork/parallel-ps3.git "$PS3_COMMIT"
          git -C ps3 checkout -q FETCH_HEAD
          git -C ps3 log -1 --format='%H %cI %s'
          sed -i '' 's#url = \.\./\.\./#url = https://github.com/#' ps3/.gitmodules
          git -C ps3 submodule -q sync
      - name: Build with the repository's own macOS script
        working-directory: ps3
        env:
          ARCH: arm64
        run: .ci/build-macos-libretro.sh
      - name: What was built
        working-directory: ps3
        run: |
          file parallel_ps3_libretro.dylib
          otool -l parallel_ps3_libretro.dylib | grep -A4 LC_BUILD_VERSION | head -8
          otool -L parallel_ps3_libretro.dylib
          shasum -a 256 parallel_ps3_libretro.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: parallel_ps3_libretro-${{ matrix.os }}
          path: ps3/parallel_ps3_libretro.dylib
          retention-days: 3
